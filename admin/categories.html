<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Manage Categories – Admin PromptHub</title>
  <link rel="icon" href="../ti.jpeg" type="image/jpeg"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="admin.css"/>
  <style>
    .cat-form-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:28px;margin-bottom:28px;}
    .cat-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
    @media(max-width:640px){.cat-form-grid{grid-template-columns:1fr;}}
    .cat-form-full{grid-column:1/-1;}
    .thumb-preview{width:80px;height:60px;border-radius:8px;object-fit:cover;border:1px solid var(--card-border);}
    .cat-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--card-border);border-radius:var(--radius-sm);background:var(--card-bg);margin-bottom:10px;transition:var(--transition);}
    .cat-row:hover{border-color:var(--primary);background:rgba(124,58,237,0.04);}
    .cat-row-icon{font-size:1.6rem;flex-shrink:0;width:40px;text-align:center;}
    .cat-row-thumb{width:40px;height:30px;border-radius:6px;object-fit:cover;flex-shrink:0;}
    .cat-row-info{flex:1;min-width:0;}
    .cat-row-name{font-weight:700;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cat-row-slug{font-size:0.72rem;color:var(--text-dim);font-family:monospace;}
    .cat-status-badge{font-size:0.68rem;padding:2px 8px;border-radius:50px;font-weight:700;flex-shrink:0;}
    .status-active{background:rgba(16,185,129,0.1);color:#10B981;border:1px solid rgba(16,185,129,0.2);}
    .status-inactive{background:rgba(239,68,68,0.1);color:#EF4444;border:1px solid rgba(239,68,68,0.2);}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9998;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal-box{background:var(--bg-2);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:28px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;position:relative;}
    .modal-title{font-family:var(--font-heading);font-size:1.15rem;font-weight:700;margin-bottom:22px;}
    .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;}
  </style>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-logo"><span class="logo-icon-text"><img src="/logo.png" alt="logo"></span><div style="font-size:0.72rem;color:var(--text-dim)">Admin Panel</div></div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link"><i class="fa fa-chart-line"></i> Dashboard</a>
      <a href="upload.html" class="sidebar-link"><i class="fa fa-upload"></i> Upload Prompt</a>
      <a href="posts.html" class="sidebar-link"><i class="fa fa-th-large"></i> Manage Posts</a>
      <a href="categories.html" class="sidebar-link active"><i class="fa fa-folder"></i> Categories</a>
      <a href="banners.html" class="sidebar-link">
   <i class="fa fa-image"></i> Banners
</a>
      <a href="messages.html" class="sidebar-link"><i class="fa fa-envelope"></i> Messages</a>
      <a href="analytics.html" class="sidebar-link"><i class="fa fa-bar-chart"></i> Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../index.html" target="_blank" class="sidebar-link"><i class="fa fa-globe"></i> View Site</a>
      <button class="sidebar-link" onclick="adminSignOut()" style="width:100%;text-align:left"><i class="fa fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
      <h1 class="admin-page-title">Category Management</h1>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
        <button class="btn btn-primary btn-sm" onclick="openModal()"><i class="fa fa-plus"></i> New Category</button>
        <img id="adminAvatar" class="user-avatar" src="" alt="Admin" style="width:34px;height:34px"/>
        <button class="btn-icon theme-toggle" id="themeToggle"><i class="fa fa-moon"></i></button>
      </div>
    </header>

    <div class="admin-content">
      <!-- STATS -->
      <div class="stats-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-bottom:24px" id="catStats">
        <div class="stat-card"><div class="loading-spinner" style="margin:0 auto"></div></div>
        <div class="stat-card"></div>
      </div>

      <!-- CATEGORY LIST -->
      <div class="admin-section">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <h2 class="admin-section-title" style="margin:0">📁 All Categories</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <select id="filterStatus" class="filter-btn" onchange="loadCategories()" style="cursor:pointer">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
            <button class="btn btn-ghost btn-sm" onclick="loadCategories()"><i class="fa fa-refresh"></i></button>
          </div>
        </div>
        <div id="catList"><div class="loading-spinner" style="margin:24px auto"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- CREATE/EDIT MODAL -->
<div class="modal-overlay" id="catModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">New Category</div>
    <button class="modal-close" onclick="closeModal()"><i class="fa fa-times"></i></button>
    <div class="cat-form-grid">
      <div class="form-group">
        <label class="form-label">Name *</label>
        <input type="text" id="fName" class="form-control" placeholder="e.g. AI Images" oninput="autoSlug()" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Slug</label>
        <input type="text" id="fSlug" class="form-control" placeholder="auto-generated"/>
      </div>
      <div class="form-group cat-form-full">
        <label class="form-label">Description</label>
        <textarea id="fDesc" class="form-control" rows="2" placeholder="Short description..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Icon (emoji)</label>
        <input type="text" id="fIcon" class="form-control" placeholder="🖼️" maxlength="4"/>
      </div>
      <div class="form-group">
        <label class="form-label">Gradient Colors</label>
        <input type="text" id="fGradient" class="form-control" placeholder="#7C3AED,#00E5FF"/>
      </div>
      <div class="form-group">
        <label class="form-label">Sort Order</label>
        <input type="number" id="fOrder" class="form-control" placeholder="0" value="0" min="0"/>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select id="fStatus" class="form-control">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="form-group cat-form-full">
        <label class="form-label">Thumbnail Image</label>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <div class="upload-zone" id="thumbZone" onclick="document.getElementById('thumbFile').click()" style="flex:1;min-width:200px;padding:16px">
            <div class="upload-zone-icon" style="font-size:1.5rem">🖼️</div>
            <div class="upload-zone-text" style="font-size:0.82rem"><strong>Click</strong> to upload thumbnail</div>
          </div>
          <div id="thumbPreview" style="display:none;flex-shrink:0">
            <img id="thumbPreviewImg" src="" alt="preview" class="thumb-preview"/>
          </div>
        </div>
        <input type="file" id="thumbFile" accept="image/*" style="display:none" onchange="handleThumbUpload(this)"/>
        <div class="progress-wrap" id="thumbProg" style="display:none;margin-top:8px"><div class="progress-fill" id="thumbProgFill"></div></div>
        <div id="thumbStatus" style="font-size:0.78rem;color:var(--text-muted);margin-top:4px"></div>
        <input type="hidden" id="fThumbUrl"/>
      </div>
      <div class="form-group cat-form-full" style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" id="saveCatBtn" onclick="saveCategory()" style="min-width:130px"><i class="fa fa-save"></i> Save Category</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/admin-auth.js"></script>
<script>
initThemeToggle();
let editingId = null;

initAdminAuth(async()=>{
  loadCategories();
});

async function loadCategories() {
  const list = document.getElementById('catList');
  const filterStatus = document.getElementById('filterStatus').value;
  list.innerHTML='<div class="loading-spinner" style="margin:24px auto"></div>';
  try {
    let cats = await DB.getCategories(false); // all statuses
    if(filterStatus) cats = cats.filter(c=>c.status===filterStatus);
    updateStats(cats);
    if(!cats.length){list.innerHTML='<div style="text-align:center;padding:32px;color:var(--text-muted)">No categories yet. <button class="btn btn-primary btn-sm" onclick="openModal()">Create first category</button></div>';return;}
    list.innerHTML = cats.map(c=>`
      <div class="cat-row">
        ${c.thumbnail?`<img src="${c.thumbnail}" alt="${sanitize(c.name)}" class="cat-row-thumb" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/><div class="cat-row-icon" style="display:none">${c.icon||getCatEmoji(c.slug||c.id)}</div>`
          :`<div class="cat-row-icon">${c.icon||getCatEmoji(c.slug||c.id)}</div>`}
        <div class="cat-row-info">
          <div class="cat-row-name">${sanitize(c.name)}</div>
          <div class="cat-row-slug">${sanitize(c.slug||c.id)}</div>
          ${c.description?`<div style="font-size:0.75rem;color:var(--text-dim);margin-top:3px">${sanitize(c.description)}</div>`:''}
        </div>
        <span style="font-size:0.72rem;color:var(--text-dim);flex-shrink:0">Order: ${c.sortOrder||0}</span>
        <span class="cat-status-badge ${c.status==='active'?'status-active':'status-inactive'}">${c.status||'active'}</span>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn-icon btn-sm-icon" onclick="editCategory('${c.id}')" title="Edit"><i class="fa fa-edit"></i></button>
          <button class="btn-icon btn-sm-icon" onclick="toggleStatus('${c.id}','${c.status||'active'}')" title="Toggle Status">
            <i class="fa fa-${c.status==='active'?'eye-slash':'eye'}"></i>
          </button>
          <button class="btn-icon btn-sm-icon danger" onclick="deleteCategory('${c.id}','${sanitize(c.name)}')" title="Delete"><i class="fa fa-trash"></i></button>
        </div>
      </div>`).join('');
  } catch(e) { list.innerHTML=`<div style="color:#EF4444;padding:20px">Error: ${e.message}</div>`; }
}

function updateStats(cats) {
  const active = cats.filter(c=>c.status!=='inactive').length;
  const inactive = cats.filter(c=>c.status==='inactive').length;
  document.getElementById('catStats').innerHTML=`
    <div class="stat-card">
      <div class="stat-card-icon" style="background:rgba(124,58,237,0.15);color:#7C3AED"><i class="fa fa-folder"></i></div>
      <div class="stat-card-body"><div class="stat-card-value">${cats.length}</div><div class="stat-card-label">Total Categories</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-icon" style="background:rgba(16,185,129,0.15);color:#10B981"><i class="fa fa-check-circle"></i></div>
      <div class="stat-card-body"><div class="stat-card-value">${active}</div><div class="stat-card-label">Active</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-icon" style="background:rgba(239,68,68,0.15);color:#EF4444"><i class="fa fa-eye-slash"></i></div>
      <div class="stat-card-body"><div class="stat-card-value">${inactive}</div><div class="stat-card-label">Inactive</div></div>
    </div>`;
}

function openModal(data=null) {
  editingId = data?.id||null;
  document.getElementById('modalTitle').textContent = editingId ? 'Edit Category' : 'New Category';
  document.getElementById('saveCatBtn').innerHTML = `<i class="fa fa-save"></i> ${editingId?'Update':'Save'} Category`;
  // Fill form
  document.getElementById('fName').value = data?.name||'';
  document.getElementById('fSlug').value = data?.slug||'';
  document.getElementById('fDesc').value = data?.description||'';
  document.getElementById('fIcon').value = data?.icon||'';
  document.getElementById('fGradient').value = data?.gradient||'';
  document.getElementById('fOrder').value = data?.sortOrder||0;
  document.getElementById('fStatus').value = data?.status||'active';
  document.getElementById('fThumbUrl').value = data?.thumbnail||'';
  const prev = document.getElementById('thumbPreview');
  const prevImg = document.getElementById('thumbPreviewImg');
  if(data?.thumbnail){prevImg.src=data.thumbnail;prev.style.display='block';}
  else{prev.style.display='none';}
  document.getElementById('thumbStatus').textContent='';
  document.getElementById('thumbProg').style.display='none';
  document.getElementById('catModal').classList.add('open');
}

function closeModal() {
  document.getElementById('catModal').classList.remove('open');
  editingId=null;
}

function autoSlug() {
  const nameVal = document.getElementById('fName').value;
  if(!editingId) document.getElementById('fSlug').value = generateSlug(nameVal);
}

async function handleThumbUpload(inp) {
  const f=inp.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  document.getElementById('thumbPreviewImg').src=url;
  document.getElementById('thumbPreview').style.display='block';
  document.getElementById('thumbProg').style.display='block';
  document.getElementById('thumbStatus').textContent='Uploading...';
  try{
    const r=await Cloudinary.upload(f,p=>document.getElementById('thumbProgFill').style.width=p+'%');
    document.getElementById('fThumbUrl').value=r.secure_url;
    document.getElementById('thumbPreviewImg').src=r.secure_url;
    document.getElementById('thumbStatus').textContent='✅ Uploaded!';
    document.getElementById('thumbStatus').style.color='#10B981';
  }catch(e){document.getElementById('thumbStatus').textContent='❌ '+e.message;document.getElementById('thumbStatus').style.color='#EF4444';}
}

async function saveCategory() {
  const name=document.getElementById('fName').value.trim();
  if(!name){showToast('Name is required','error');return;}
  const slug=document.getElementById('fSlug').value.trim()||generateSlug(name);
  const data = {
    name, slug,
    description: document.getElementById('fDesc').value.trim(),
    icon: document.getElementById('fIcon').value.trim(),
    gradient: document.getElementById('fGradient').value.trim(),
    sortOrder: parseInt(document.getElementById('fOrder').value)||0,
    status: document.getElementById('fStatus').value,
    thumbnail: document.getElementById('fThumbUrl').value||''
  };
  const btn=document.getElementById('saveCatBtn');
  btn.disabled=true; btn.innerHTML='<i class="fa fa-spinner fa-spin"></i> Saving...';
  try {
    if(editingId) await DB.updateCategory(editingId,data);
    else await DB.createCategory(data);
    showToast(editingId?'Category updated! ✅':'Category created! 🚀','success');
    closeModal(); loadCategories();
  } catch(e){showToast('Error: '+e.message,'error');}
  btn.disabled=false; btn.innerHTML=`<i class="fa fa-save"></i> ${editingId?'Update':'Save'} Category`;
}

async function editCategory(id) {
  try {
    const cat=await DB.getCategory(id);
    if(!cat){showToast('Category not found','error');return;}
    openModal(cat);
  } catch(e){showToast('Error: '+e.message,'error');}
}

async function toggleStatus(id, currentStatus) {
  const newStatus = currentStatus==='active'?'inactive':'active';
  try {
    await DB.updateCategory(id,{status:newStatus});
    showToast(`Category ${newStatus==='active'?'activated':'deactivated'}`,'success');
    loadCategories();
  } catch(e){showToast('Error: '+e.message,'error');}
}

async function deleteCategory(id, name) {
  if(!confirm(`Delete category "${name}"? This will not delete prompts in it.`)) return;
  try {
    await DB.deleteCategory(id);
    showToast('Category deleted','success');
    loadCategories();
  } catch(e){showToast('Error: '+e.message,'error');}
}

// Close modal on overlay click
document.getElementById('catModal').addEventListener('click',function(e){if(e.target===this)closeModal();});

function toggleSidebar(){document.getElementById('adminSidebar').classList.toggle('open');}
</script>
</body>
</html>
