<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login – PromptHub</title>
  <link rel="icon" href="../ti.jpeg" type="image/jpeg"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
<div class="admin-login-orb1"></div>
<div class="admin-login-orb2"></div>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div style="text-align:center;margin-bottom:28px">
      <img src="../logo.png" alt="PromptHub" style="height:40px;margin:0 auto 12px;display:block" onerror="this.style.display='none'"/>
      <div class="logo-icon-text" style="font-size:1.4rem;display:block;margin-bottom:12px">⚡ PromptHub</div>
      <div class="admin-badge"><i class="fa fa-crown"></i> ADMIN ACCESS ONLY</div>
    </div>

    <h1 style="font-family:var(--font-heading);font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:6px">Welcome Back, Admin</h1>
    <p style="text-align:center;color:var(--text-muted);font-size:0.875rem;margin-bottom:28px">Sign in to manage PromptHub</p>

    <!-- GOOGLE -->
    <button class="btn-google" onclick="doGoogleLogin()" style="margin-bottom:16px">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M47.5 24.6c0-1.6-.1-3.1-.4-4.6H24v8.7h13.2c-.6 3-2.3 5.5-5 7.2v6h8c4.7-4.3 7.3-10.7 7.3-17.3z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-8-6c-2.1 1.4-4.8 2.3-7.9 2.3-6.1 0-11.2-4.1-13.1-9.6H2.6v6.2C6.5 42.5 14.7 48 24 48z"/><path fill="#FBBC05" d="M10.9 28.9c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4v-6.2H2.6C1 17 0 20.4 0 24s1 7 2.6 9.9l8.3-5z"/><path fill="#EA4335" d="M24 9.5c3.4 0 6.5 1.2 8.9 3.5l6.6-6.6C35.9 2.6 30.5 0 24 0 14.7 0 6.5 5.5 2.6 13.9l8.3 5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider" style="margin:16px 0">or use email & password</div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div style="position:relative">
          <i class="fa fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim)"></i>
          <input type="email" id="adminEmail" class="form-control" style="padding-left:38px" placeholder="admin@example.com"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <i class="fa fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim)"></i>
          <input type="password" id="adminPass" class="form-control" style="padding-left:38px;padding-right:44px" placeholder="••••••••"/>
          <button onclick="togglePass()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);cursor:pointer"><i class="fa fa-eye" id="eyeIcon"></i></button>
        </div>
      </div>

      <button id="loginBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:1rem" onclick="doEmailLogin()">
        <i class="fa fa-sign-in-alt"></i> Sign In to Admin
      </button>
    </div>

    <!-- ERROR FROM REDIRECT -->
    <div id="errorMsg" style="display:none;margin-top:16px;padding:12px 16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-sm);color:#EF4444;font-size:0.85rem;text-align:center"></div>

    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--card-border);text-align:center">
      <p style="font-size:0.78rem;color:var(--text-dim)">🔒 This panel is restricted to authorized administrators only.</p>
      <a href="../index.html" style="font-size:0.82rem;color:var(--text-muted);margin-top:8px;display:inline-block"><i class="fa fa-arrow-left"></i> Back to Site</a>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="bottom:30px"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/admin-auth.js"></script>
<script>
  initThemeToggle();
  // Check URL error param
  const urlErr = new URLSearchParams(location.search).get('error');
  if (urlErr === 'notadmin') {
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'block';
    errEl.textContent = '⚠️ This account does not have admin access.';
  }

  // If already logged in as admin, redirect
  auth.onAuthStateChanged(async user => {
    if (user) {
      const ud = await DB.getUser(user.uid);
      if (ud?.role === 'admin') {
        window.location.href = '/admin/index.html';
      }
    }
  });

  async function doEmailLogin() {
    const email = document.getElementById('adminEmail').value.trim();
    const pass = document.getElementById('adminPass').value;
    if (!email || !pass) { showToast('Fill in all fields', 'error'); return; }
    const btn = document.getElementById('loginBtn');
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Signing in...';
    btn.disabled = true;
    const ok = await adminLoginEmail(email, pass);
    if (ok) {
      showToast('Welcome, Admin! 👑', 'success');
      setTimeout(()=>window.location.href='index.html', 800);
    } else {
      btn.innerHTML = '<i class="fa fa-sign-in-alt"></i> Sign In to Admin';
      btn.disabled = false;
    }
  }

  async function doGoogleLogin() {
    const ok = await adminLoginGoogle();
    if (ok) {
      showToast('Welcome, Admin! 👑', 'success');
      setTimeout(()=>window.location.href='index.html', 800);
    }
  }

  function togglePass() {
    const inp = document.getElementById('adminPass');
    const icon = document.getElementById('eyeIcon');
    inp.type = inp.type==='password' ? 'text' : 'password';
    icon.className = inp.type==='password' ? 'fa fa-eye' : 'fa fa-eye-slash';
  }

  document.addEventListener('keydown', e => { if(e.key==='Enter') doEmailLogin(); });
</script>
</body>
</html>
