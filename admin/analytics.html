<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Analytics – Admin PromptHub</title>
  <link rel="icon" href="../ti.jpeg" type="image/jpeg"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="admin.css"/>
  <style>
    .chart-wrap{position:relative;height:220px;display:flex;align-items:flex-end;gap:6px;padding-top:10px;}
    .bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
    .bar{width:100%;border-radius:5px 5px 0 0;transition:height 0.6s cubic-bezier(0.4,0,0.2,1);min-height:4px;position:relative;}
    .bar:hover{filter:brightness(1.2);}
    .bar-label{font-size:0.6rem;color:var(--text-dim);white-space:nowrap;text-align:center;overflow:hidden;max-width:100%;}
    .bar-val{font-size:0.65rem;color:var(--text-muted);font-weight:600;}
    .donut-svg{transform:rotate(-90deg);}
    .donut-wrap{position:relative;width:180px;height:180px;margin:0 auto;}
    .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .kpi{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;text-align:center;transition:var(--transition);}
    .kpi:hover{border-color:rgba(124,58,237,0.3);transform:translateY(-2px);}
    .kpi-val{font-family:var(--font-heading);font-size:2rem;font-weight:900;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .kpi-label{font-size:0.8rem;color:var(--text-muted);margin-top:4px;}
  </style>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-logo"><span class="logo-icon-text"><img src="/logo.png" alt="logo"></span><div style="font-size:0.72rem;color:var(--text-dim)">Admin Panel</div></div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link"><i class="fa fa-chart-line"></i> Dashboard</a>
      <a href="upload.html" class="sidebar-link"><i class="fa fa-upload"></i> Upload Prompt</a>
      <a href="posts.html" class="sidebar-link"><i class="fa fa-th-large"></i> Manage Posts</a>
      <a href="categories.html" class="sidebar-link"><i class="fa fa-folder"></i> Categories</a>
      <a href="banners.html" class="sidebar-link">
   <i class="fa fa-image"></i> Banners
</a>
      <a href="messages.html" class="sidebar-link"><i class="fa fa-envelope"></i> Messages</a>
      <a href="analytics.html" class="sidebar-link active"><i class="fa fa-bar-chart"></i> Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../index.html" target="_blank" class="sidebar-link"><i class="fa fa-globe"></i> View Site</a>
      <button class="sidebar-link" onclick="adminSignOut()" style="width:100%;text-align:left"><i class="fa fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
      <h1 class="admin-page-title">Analytics</h1>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
        <button class="btn-icon theme-toggle" id="themeToggle"><i class="fa fa-moon"></i></button>
      </div>
    </header>
    <div class="admin-content" id="analyticsContent">
      <div class="loading-spinner" style="margin:60px auto"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/admin-auth.js"></script>
<script>
initThemeToggle();
initAdminAuth(async()=>{
  try{
    const[analytics,snap]=await Promise.all([DB.getAnalytics(),db.collection('prompts').get()]);
    const all=snap.docs.map(d=>d.data());
    renderAnalytics(analytics,all);
  }catch(e){document.getElementById('analyticsContent').innerHTML=`<p style="color:var(--text-muted)">Error: ${e.message}</p>`;}
});

function renderAnalytics(a,prompts){
  const catCounts={},toolCounts={};
  prompts.forEach(p=>{
    catCounts[p.category||'Other']=(catCounts[p.category||'Other']||0)+1;
    toolCounts[p.tool||'Unknown']=(toolCounts[p.tool||'Unknown']||0)+1;
  });
  const images=prompts.filter(p=>p.type!=='video').length;
  const videos=prompts.filter(p=>p.type==='video').length;
  const total=prompts.length||1;

  document.getElementById('analyticsContent').innerHTML=`
    <!-- KPIs -->
    <div class="stats-grid">
      <div class="kpi"><div class="kpi-val">${formatNumber(a.totalPrompts)}</div><div class="kpi-label">📝 Total Prompts</div></div>
      <div class="kpi"><div class="kpi-val">${formatNumber(a.totalViews)}</div><div class="kpi-label">👁 Total Views</div></div>
      <div class="kpi"><div class="kpi-val">${formatNumber(a.totalLikes)}</div><div class="kpi-label">❤️ Total Likes</div></div>
      <div class="kpi"><div class="kpi-val">${formatNumber(a.totalCopies)}</div><div class="kpi-label">📋 Total Copies</div></div>
    </div>

    <!-- CHARTS ROW -->
    <div class="admin-two-col">
      <div class="admin-section">
        <h2 class="admin-section-title">📊 By AI Tool</h2>
        <div class="chart-wrap" id="toolChart"></div>
      </div>
      <div class="admin-section" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
        <h2 class="admin-section-title" style="text-align:center;width:100%">🎯 Content Type</h2>
        <div class="donut-wrap">
          ${buildDonut(images,videos,total)}
          <div class="donut-center">
            <div style="font-family:var(--font-heading);font-weight:800;font-size:1.4rem">${total}</div>
            <div style="font-size:0.72rem;color:var(--text-muted)">Total</div>
          </div>
        </div>
        <div style="display:flex;gap:20px;margin-top:18px">
          <div style="display:flex;align-items:center;gap:7px"><div style="width:11px;height:11px;border-radius:50%;background:#7C3AED"></div><span style="font-size:0.8rem;color:var(--text-muted)">Images (${images})</span></div>
          <div style="display:flex;align-items:center;gap:7px"><div style="width:11px;height:11px;border-radius:50%;background:#FF4ECD"></div><span style="font-size:0.8rem;color:var(--text-muted)">Videos (${videos})</span></div>
        </div>
      </div>
    </div>

    <!-- CATEGORY CHART -->
    <div class="admin-section">
      <h2 class="admin-section-title">📁 By Category</h2>
      <div class="chart-wrap" id="catChart" style="height:180px"></div>
    </div>

    <!-- TOP TABLES -->
    <div class="admin-two-col">
      <div class="admin-section">
        <h2 class="admin-section-title">🔥 Top by Likes</h2>
        ${buildTopTable(a.topByLikes||[],'likes')}
      </div>
      <div class="admin-section">
        <h2 class="admin-section-title">📋 Top by Copies</h2>
        ${buildTopTable(a.topByCopies||[],'copies')}
      </div>
    </div>
  `;
  renderBarChart('toolChart',toolCounts);
  renderBarChart('catChart',catCounts);
}

function buildDonut(images,videos,total){
  const r=70,cx=90,cy=90,circ=2*Math.PI*r;
  const imgD=(images/total)*circ,vidD=(videos/total)*circ;
  return `<svg class="donut-svg" width="180" height="180" viewBox="0 0 180 180">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="22"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#7C3AED" stroke-width="22" stroke-dasharray="${imgD} ${circ}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#FF4ECD" stroke-width="22" stroke-dasharray="${vidD} ${circ}" stroke-dashoffset="${-imgD}" stroke-linecap="round"/>
  </svg>`;
}

function buildTopTable(items,field){
  if(!items.length) return '<p style="color:var(--text-muted)">No data yet</p>';
  return `<table style="width:100%;font-size:0.82rem;border-collapse:collapse">
    ${items.map((p,i)=>`<tr style="border-bottom:1px solid var(--card-border)">
      <td style="padding:10px 0;color:var(--text-dim);font-weight:700;width:26px">#${i+1}</td>
      <td style="padding:10px 6px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px">${sanitize(p.title||'Untitled')}</td>
      <td style="padding:10px 0;text-align:right;color:var(--text-muted);white-space:nowrap">
        ${field==='likes'?'<i class="fa fa-heart" style="color:#FF4ECD;margin-right:4px"></i>':'<i class="fa fa-copy" style="margin-right:4px"></i>'}
        ${formatNumber(p[field]||0)}
      </td>
    </tr>`).join('')}
  </table>`;
}

const COLORS=['#7C3AED','#00E5FF','#FF4ECD','#F59E0B','#10B981','#EF4444','#8B5CF6','#06B6D4'];
function renderBarChart(id,data){
  const el=document.getElementById(id);if(!el)return;
  const entries=Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=Math.max(...entries.map(e=>e[1]),1);
  const chartH=parseInt(el.style.height)||220;
  el.innerHTML=entries.map(([label,val],i)=>{
    const h=Math.max(4,Math.round((val/max)*(chartH-30)));
    const short=label.length>9?label.slice(0,8)+'…':label;
    return `<div class="bar-group">
      <div class="bar-val">${formatNumber(val)}</div>
      <div class="bar" style="height:${h}px;background:${COLORS[i%COLORS.length]};opacity:0.85" title="${label}: ${val}"></div>
      <div class="bar-label">${short}</div>
    </div>`;
  }).join('');
}

function toggleSidebar(){document.getElementById('adminSidebar').classList.toggle('open');}
</script>
</body>
</html>
