const promptId = getParam('id');

if (!promptId) { window.location.href = 'feed.html'; }

async function loadPrompt() {
  try {
    promptData = await DB.getPrompt(promptId);
    if (!promptData) throw new Error('Prompt not found');
    document.title = `${promptData.title} – PromptHub`;
    DB.incrementField('prompts', promptId, 'views').catch(()=>{});
    renderPrompt();
  } catch(e) {
    document.getElementById('promptContent').innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">😕</div>
        <h3>Prompt Not Found</h3>
        <p>${e.message}</p>
        <a href="feed.html" class="btn btn-primary">Browse Prompts</a>
      </div>`;
  }
}

// ── 5-SECTION SCROLL UNLOCK ──
function initPromptUnlock(){
  const REQUIRED = 5;
  let seen = 0;
  let unlocked = false;

  // Sections to track: badges, title+meta, description, share, tools, tags, related, comments
  const sectionSelectors = [
    '.detail-grid > div:first-child .media-full',  // media (section 1)
    '.detail-meta',                                  // meta info (section 2)
    '[data-section="share"]',                        // share (section 3)
    '[data-section="tools"]',                        // ai tools (section 4)
    '#relatedGrid',                                  // related prompts (section 5)
  ];

  const overlay = document.getElementById('promptLockOverlay');
  const fill    = document.getElementById('unlockFill');
  const count   = document.getElementById('unlockCount');
  if(!overlay) return;

  function updateProgress(){
    const pct = Math.min((seen / REQUIRED) * 100, 100);
    if(fill) fill.style.width = pct + '%';
    if(count) count.textContent = `${Math.min(seen, REQUIRED)} / ${REQUIRED} sections viewed`;
  }

  function doUnlock(){
    if(unlocked) return;
    unlocked = true;
    // Fade out overlay
    if(overlay){ overlay.classList.add('unlocked'); }
    // Unblur text
    document.querySelectorAll('.prompt-blur-text').forEach(el=>el.classList.add('unblurred'));
    // Enable copy button
    const btn = document.getElementById('mainCopyBtn');
    if(btn){
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-copy"></i> Copy Prompt';
    }
    // Remove overlay from DOM after animation
    setTimeout(()=>{ if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 600);
  }

  updateProgress();

  // IntersectionObserver — fires when each section enters viewport
  const io = new IntersectionObserver((entries)=>{
    if(unlocked) return;
    entries.forEach(entry=>{
      if(entry.isIntersecting && !entry.target._counted){
        entry.target._counted = true;
        seen++;
        updateProgress();
        if(seen >= REQUIRED) doUnlock();
      }
    });
  }, { threshold: 0.3 });

  // Observe sections (wait for DOM to settle)
  setTimeout(()=>{
    sectionSelectors.forEach(sel=>{
      const el = document.querySelector(sel);
      if(el) io.observe(el);
    });
    // If page is already scrolled / sections already visible, count them immediately
    sectionSelectors.forEach(sel=>{
      const el = document.querySelector(sel);
      if(!el) return;
      const rect = el.getBoundingClientRect();
      if(rect.top < window.innerHeight * 0.85 && !el._counted){
        el._counted = true; seen++;
      }
    });
    updateProgress();
    if(seen >= REQUIRED) doUnlock();
  }, 300);
}

// AI TOOL BUTTONS with autofill (Task #5)
function buildToolButtons(activeTool, promptText) {
  const tools = [
    {name:'ChatGPT',emoji:'🤖'},
    {name:'Gemini',emoji:'🌟'},
    {name:'Claude',emoji:'💡'},
    {name:'Grok',emoji:'🔭'},
    {name:'DeepSeek',emoji:'🧠'},
    {name:'Perplexity',emoji:'🔍'},
    {name:'Midjourney',emoji:'🎨',url:'https://www.midjourney.com'},
    {name:'Kling AI',emoji:'⚡',url:'https://klingai.com'},
    {name:'Runway ML',emoji:'🎬',url:'https://runwayml.com'},
    {name:'Leonardo AI',emoji:'🎭',url:'https://leonardo.ai'},
  ];
  const c = document.getElementById('toolBtns'); if(!c) return;
  c.innerHTML = tools.map(t=>`
    <button class="ai-tool-btn ${t.name===activeTool?'active-tool':''}" onclick="handleToolOpen('${t.name}')">
      <span>${t.emoji}</span>
      <span>${t.name}${t.name===activeTool?' ✓':''}</span>
    </button>`).join('');
}

// Simple-URL tools (image/design tools) just open
const simpleToolUrls = {
  'Midjourney':'https://www.midjourney.com',
  'Kling AI':'https://klingai.com',
  'Runway ML':'https://runwayml.com',
  'Leonardo AI':'https://leonardo.ai'
};

function handleToolOpen(toolName) {
  if(!promptData) return;
  if(simpleToolUrls[toolName]) {
    copyToClipboard(promptData.prompt||'');
    window.open(simpleToolUrls[toolName],'_blank','noopener');
    showToast('Prompt copied! Paste it into '+toolName,'success',4000);
    try{DB.incrementField('prompts',promptId,'copies');}catch{}
    return;
  }
  openInAITool(toolName, promptData.prompt||'');
  try{DB.incrementField('prompts',promptId,'copies');}catch{}
}

function handleDonate() {
  const UPI_ID = 'mageshwaranm@nyes';
  const UPI_NAME = 'Mageshwaran M';
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile) {
    // UPI deep link – opens installed payment apps
    const upiLink = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(UPI_NAME)}&cu=INR`;

    showToast('UPI ID copied! Open your payment app and pay to: '+UPI_ID,'success',5000);
  }
}

async function loadRelated() {
  const grid = document.getElementById('relatedGrid'); if(!grid||!promptData) return;
  try {
    const related = await DB.getPrompts({category:promptData.category,limit:5});
    const filtered = related.filter(p=>p.id!==promptId).slice(0,3);
    if(!filtered.length){grid.innerHTML='<p style="color:var(--text-muted)">No related prompts yet.</p>';return;}
    grid.innerHTML = filtered.map(p=>`
      <div class="prompt-card" onclick="window.location.href='prompt.html?id=${p.id}'" style="cursor:pointer">
        <div class="card-media" style="aspect-ratio:16/9">
          ${p.imageUrl||p.thumbnailUrl?`<img src="${p.imageUrl||p.thumbnailUrl}" loading="lazy" style="width:100%;height:100%;object-fit:cover"/>`:`<div class="card-media-placeholder" style="height:100%">${getToolEmoji(p.tool)}</div>`}
        </div>
        <div class="card-body" style="padding:10px">
          <div class="card-tool-tag" style="font-size:0.68rem">${getToolEmoji(p.tool)} ${sanitize(p.tool||'')}</div>
          <div class="card-title" style="font-size:0.82rem;margin-top:6px">${sanitize(p.title||'')}</div>
        </div>
      </div>`).join('');
  } catch(e){grid.innerHTML='';}
}

async function loadComments() {
  const list = document.getElementById('commentsList'); if(!list) return;
  try {
    const comments = await DB.getComments(promptId);
    if(!comments.length){list.innerHTML='<p style="color:var(--text-muted);text-align:center;padding:28px">No comments yet. Be the first!</p>';return;}
    list.innerHTML = comments.map(c=>`
      <div class="comment">
        <div class="comment-avatar">👤</div>
        <div class="comment-content">
          <div class="comment-author">${sanitize(c.userName||'Anonymous')}</div>
          <div class="comment-text">${sanitize(c.text||'')}</div>
          <div class="comment-time">${formatDate(c.createdAt)}</div>
        </div>
      </div>`).join('');
  } catch(e){list.innerHTML='<p style="color:var(--text-muted)">Could not load comments.</p>';}
}

async function submitComment() {
  const input = document.getElementById('commentInput');
  const text = input?.value.trim();
  if(!text){showToast('Enter a comment first','error');return;}
  input.value='';
  try {
    await DB.addComment(promptId,'anonymous','Visitor',text);
    showToast('Comment posted! 💬','success');
    loadComments();
    const cc=document.getElementById('commentCount');
    if(cc&&promptData){promptData.comments=(promptData.comments||0)+1;cc.textContent=`(${promptData.comments})`;}
  } catch(e){showToast('Error: '+e.message,'error');}
}

function downloadMedia(url,name){
  const a=document.createElement('a');
  a.href=url; a.download=name.replace(/[^a-z0-9]/gi,'_').toLowerCase(); a.target='_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('Download started...','success');
}
</script>
</body>
