<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Saved Prompts – PromptHub</title>
  <link rel="icon" href="../ti.jpeg" type="image/jpeg"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2870973257436294"
     crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo"><span class="logo-icon-text">⚡ PromptHub</span></a>
    <div class="nav-actions" style="margin-left:auto">
      <button class="btn-icon theme-toggle" id="themeToggle"><i class="fa fa-moon"></i></button>
      <div id="authButtons"><a href="../admin/login.html" class="btn btn-ghost">Login</a></div>
      <div id="userMenu" style="display:none" class="user-menu">
        <div class="dropdown-menu" id="dropdownMenu">
          <a href="saved.html"><i class="fa fa-bookmark"></i> Saved</a>
          <button onclick="signOutUser()"><i class="fa fa-sign-out-alt"></i> Logout</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<main style="padding:calc(var(--nav-height)+40px) 0 80px">
  <div class="container">
    <div class="page-header" style="text-align:left;padding-top:0;padding-bottom:32px">
      <h1 class="page-title">🔖 Saved Prompts</h1>
      <p class="page-sub">Your collection of saved prompts</p>
    </div>
    <div class="prompt-grid" id="savedGrid">
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
    </div>
  </div>
</main>

<nav class="mobile-nav">
  <a href="../index.html" class="mobile-nav-item"><i class="fa fa-home"></i><span>Home</span></a>
  <a href="feed.html" class="mobile-nav-item"><i class="fa fa-compass"></i><span>Explore</span></a>
  <a href="search.html" class="mobile-nav-item"><i class="fa fa-search"></i><span>Search</span></a>
  <a href="saved.html" class="mobile-nav-item active"><i class="fa fa-bookmark"></i><span>Saved</span></a>
  </nav>
<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script>
  initNavbarScroll(); initThemeToggle();
  auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    const grid = document.getElementById('savedGrid');
    try {
      const saved = await DB.getSavedPrompts(user.uid);
      if (!saved.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔖</div><h3>No saved prompts yet</h3><p>Save prompts you love to access them here anytime!</p><a href="feed.html" class="btn btn-primary">Explore Prompts</a></div>`;
        return;
      }
      grid.innerHTML = saved.map((p,i) => buildPromptCard(p,i)).join('');
    } catch(e) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;
    }
  });
</script>
</body>
</html>
