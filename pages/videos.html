<main style="padding-top:calc(var(--nav-height)+40px);padding-bottom:80px">

<script src="../js/firebase-config.js"></script>

<script>
initNavbarScroll(); initHamburger(); initThemeToggle();
let currentTool='';

function buildVideoCard(v,i){
  const thumb=v.thumbnailUrl||v.imageUrl||'';
  return `
  <div class="video-card" onclick="viewPrompt('${v.id}')" style="animation:fadeUp 0.5s ease both;animation-delay:${i*0.07}s">
    <div class="video-thumb">
      ${thumb?`<img src="${thumb}" alt="${sanitize(v.title||'')}" loading="lazy"/>`:`<div style="height:100%;background:linear-gradient(135deg,var(--bg-2),var(--bg-3));display:flex;align-items:center;justify-content:center;font-size:3rem">🎬</div>`}
      <div class="video-play"><div class="video-play-icon"><i class="fa fa-play"></i></div></div>
      <div class="video-duration">${v.duration||'AI Video'}</div>
    </div>
    <div class="card-body">
      <div class="card-tool-tag">${getToolEmoji(v.tool)} ${sanitize(v.tool||'AI')}</div>
      <div class="card-title">${sanitize(v.title||'Video Prompt')}</div>
      <div class="card-desc">${sanitize(v.description||'')}</div>
      <div class="card-meta" style="margin-top:8px">
        <span><i class="fa fa-eye"></i> ${formatNumber(v.views||0)}</span>
        <span>·</span><span><i class="fa fa-heart"></i> ${formatNumber(v.likes||0)}</span>
        <span>·</span><span>${formatDate(v.createdAt)}</span>
      </div>
    </div>
    <div class="card-footer" onclick="event.stopPropagation()">
      <span class="card-action-btn"><i class="fa fa-eye"></i> ${formatNumber(v.views||0)}</span>
      <button class="card-copy-btn" onclick="handleCopy('${v.id}',\`${escapeText(v.prompt||'')}\`,this)"><i class="fa fa-copy"></i> Copy</button>
    </div>
  </div>`;
}
function escapeText(t){return t.replace(/`/g,'\\`').replace(/\$/g,'\\$');}

async function loadVideos(tool='',append=false){
  const grid=document.getElementById('videoGrid');
  if(!append) grid.innerHTML=Array(6).fill('<div class="skeleton-card skeleton-video"></div>').join('');
  try {
    const opts={type:'video',limit:12,orderBy:'createdAt'};
    if(tool) opts.tool=tool;
    const videos=await DB.getPrompts(opts);
    if(!append) grid.innerHTML='';
    if(!videos.length&&!append){
      grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🎬</div><h3>Video prompts coming soon!</h3>
        <p>Admin is uploading video prompts. Check back shortly.</p>
        <a href="feed.html" class="btn btn-primary">Browse All Prompts</a>
      </div>`;
      return;
    }
    videos.forEach((v,i)=>{const d=document.createElement('div');d.innerHTML=buildVideoCard(v,i);grid.appendChild(d.firstElementChild);});
    document.getElementById('loadMoreBtn').style.display=videos.length>=12?'inline-flex':'none';
  } catch(e){
    if(!append) grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;
  }
}

function filterVideos(tool,btn){
  currentTool=tool;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadVideos(tool);
}
loadVideos();
</script>
</body>
