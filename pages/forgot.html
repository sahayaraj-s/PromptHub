<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Forgot Password – PromptHub</title>
  <link rel="icon" href="../ti.jpeg" type="image/jpeg"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    .auth-orb { position:fixed;width:400px;height:400px;border-radius:50%;background:rgba(124,58,237,0.12);filter:blur(80px);bottom:-100px;right:-100px;pointer-events:none; }
  </style>
</head>
<body>
<div class="auth-orb"></div>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1">
  <div class="auth-card" style="animation:scaleIn 0.4s ease both">
    <div class="auth-logo"><a href="../index.html" class="logo-icon-text">⚡ PromptHub</a></div>
    <div id="formView">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link</p>
      <div class="auth-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div style="position:relative">
            <i class="fa fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim)"></i>
            <input type="email" id="resetEmail" class="form-control" style="padding-left:38px" placeholder="you@example.com"/>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:13px" onclick="doReset()">
          <i class="fa fa-paper-plane"></i> Send Reset Link
        </button>
      </div>
    </div>
    <div id="successView" style="display:none;text-align:center;padding:20px 0">
      <div style="font-size:3rem;margin-bottom:16px">📧</div>
      <h2 style="font-family:var(--font-heading);font-weight:700;margin-bottom:10px">Check Your Email</h2>
      <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:24px">We've sent a password reset link to your email address.</p>
      <a href="../admin/login.html" class="btn btn-primary" style="justify-content:center;width:100%">Back to Login</a>
    </div>
    <div class="auth-footer" style="margin-top:20px">
      <a href="../admin/login.html" style="color:var(--text-muted)"><i class="fa fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script>
  async function doReset() {
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) { showToast('Enter your email address', 'error'); return; }
    try {
      await auth.sendPasswordResetEmail(email);
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } catch(e) {
      const msgs = { 'auth/user-not-found': 'No account found with this email.', 'auth/invalid-email': 'Invalid email address.' };
      showToast(msgs[e.code] || e.message, 'error');
    }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); });
</script>
</body>
</html>
